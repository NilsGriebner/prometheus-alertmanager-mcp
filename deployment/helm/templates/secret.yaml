{{- if and .Values.alertmanager.username (not .Values.alertmanager.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alertmanager-mcp.fullname" . }}
  labels:
    {{- include "alertmanager-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.alertmanager.secretKeys.username }}: {{ .Values.alertmanager.username | quote }}
  {{ .Values.alertmanager.secretKeys.password }}: {{ .Values.alertmanager.password | default "" | quote }}
{{- end }}