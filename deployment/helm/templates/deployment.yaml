apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alertmanager-mcp.fullname" . }}
  labels:
    {{- include "alertmanager-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alertmanager-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alertmanager-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --alertmanager.url={{ required "alertmanager.url is required" .Values.alertmanager.url }}
            - --mcp.listen.address={{ .Values.mcp.listenAddress }}
            - --log.level={{ .Values.log.level }}
          {{- if or .Values.alertmanager.username .Values.alertmanager.existingSecret }}
          env:
            - name: ALERTMANAGER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertmanager.existingSecret | default (include "alertmanager-mcp.fullname" .) }}
                  key: {{ .Values.alertmanager.secretKeys.username }}
            - name: ALERTMANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertmanager.existingSecret | default (include "alertmanager-mcp.fullname" .) }}
                  key: {{ .Values.alertmanager.secretKeys.password }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /mcp
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /mcp
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}